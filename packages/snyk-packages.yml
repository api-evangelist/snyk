description: >-
  Snyk's distribution centre of gravity is the CLI, not an API client library. The npm
  `snyk` package is the CLI and is released almost daily (1.1307.0 on 2026-08-26) and is
  also the artifact that carries the MCP server (`snyk mcp -t stdio`). Around it sit a
  Maven plugin, a Gradle plugin, Homebrew and Scoop taps, and a Docker image with 44M+
  pulls. What Snyk does NOT ship is a supported first-party SDK for the REST API in any
  language: the only Python client, snyk-labs/pysnyk, is described in Snyk's own docs as
  "the unsupported pysnyk Python client" and its last PyPI release was 2024-01-13, more
  than two years behind the 2026-03-25 REST API version. Consumers of the REST API are
  expected to call it directly.
