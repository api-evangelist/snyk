sdk_gap:
  rest_api_sdks: 0
  note: >-
    No first-party, supported SDK exists for the Snyk REST or V1 API in any language.
    Java (snyk/code-sdk-java) and Go (snyk/code-client-go) clients exist but target the
    Snyk Code scanning service consumed by Snyk's own IDE plugins, not the public REST
    API. This is worth stating explicitly because a reader will otherwise assume the very
    active npm `snyk` package is an API client - it is a scanner CLI.
