      pattern: ^(wip|work-in-progress|experimental|beta|((([0-9]{4})-([0-1][0-9]))-((3[01])|(0[1-9])|([12][0-9]))(~(wip|work-in-progress|experimental|beta))?))$
      type: string
    OrgInvitationAttributes:
      additionalProperties: false
      properties:
        email:
          description: The email address of the invitee.
          example: example@email.com
          type: string
        is_active:
          description: 'The active status of the invitation. is_active of true indicates that the invitation is still waiting to be accepted. Invitations are considered inactive when accepted or revoked.

            '
          example: true
          type: boolean
        role:
          description: The role assigned to the invitee on acceptance.
          example: Developer
          type: string
      required:
      - email
      - is_active
      - role
      type: object
    OrgInvitation20240621:
      additionalProperties: false
      properties:
        attributes:
          $ref: '#/components/schemas/OrgInvitationAttributes20230828'
        id:
          format: uuid
          type: string
        relationships:
