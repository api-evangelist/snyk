openapi: 3.0.3
info:
  title: Snyk AccessRequests Invites API
  version: REST
servers:
- description: Snyk REST API
  url: https://api.snyk.io/rest
security:
- APIToken: []
- BearerAuth: []
tags:
- name: Invites
paths:
  /orgs/{org_id}/invites:
    get:
      description: 'List pending user invitations to an organization.


        #### Required permissions


        - `View Organization (org.read)`


        - `View users (org.user.read)`'
      operationId: listOrgInvitation
      parameters:
      - description: The id of the org the user is being invited to
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      - $ref: '#/components/parameters/Version'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/OrgInvitation'
                    type: array
                  jsonapi:
                    $ref: '#/components/schemas/JsonApi'
                  links:
                    $ref: '#/components/schemas/Links'
                required:
                - jsonapi
                - data
                - links
                type: object
          description: List of pending invitations to an organization.
          headers:
            deprecation:
              $ref: '#/components/headers/DeprecationHeader'
            snyk-request-id:
              $ref: '#/components/headers/RequestIdResponseHeader'
            snyk-version-lifecycle-stage:
              $ref: '#/components/headers/VersionStageResponseHeader'
            snyk-version-requested:
              $ref: '#/components/headers/VersionRequestedResponseHeader'
            snyk-version-served:
              $ref: '#/components/headers/VersionServedResponseHeader'
            sunset:
              $ref: '#/components/headers/SunsetHeader'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      summary: List pending user invitations to an organization.
      tags:
      - Invites
      x-snyk-api-lifecycle: released
      x-snyk-api-releases:
      - '2022-11-14'
      x-snyk-api-resource: org_invitations
      x-snyk-api-stability: ga
      x-snyk-api-version: '2022-11-14'
      x-stability-level: stable
    post:
      description: 'Invite a user to an organization with a role.


        #### Required permissions


        - `Invite users (org.user.invite)`'
      operationId: createOrgInvitation
      parameters:
      - $ref: '#/components/parameters/Version'
      - description: The id of the org the user is being invited to
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              additionalProperties: false
              properties:
                data:
                  $ref: '#/components/schemas/OrgInvitationPostData'
              required:
              - data
              type: object
      responses:
        '201':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/OrgInvitation20240621'
                  jsonapi:
                    $ref: '#/components/schemas/JsonApi'
                  links:
                    $ref: '#/components/schemas/Links'
                required:
                - jsonapi
                - data
                type: object
          description: A new organization invitation has been created
          headers:
            deprecation:
              $ref: '#/components/headers/DeprecationHeader'
            location:
              schema:
                type: string
            snyk-request-id:
              $ref: '#/components/headers/RequestIdResponseHeader'
            snyk-version-lifecycle-stage:
              $ref: '#/components/headers/VersionStageResponseHeader'
            snyk-version-requested:
              $ref: '#/components/headers/VersionRequestedResponseHeader'
            snyk-version-served:
              $ref: '#/components/headers/VersionServedResponseHeader'
            sunset:
              $ref: '#/components/headers/SunsetHeader'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      summary: Invite a user to an organization
      tags:
      - Invites
      x-snyk-api-lifecycle: released
      x-snyk-api-releases:
      - '2022-06-01'
      - '2023-04-28'
      - '2024-06-21'
      x-snyk-api-resource: org_invitations
      x-snyk-api-stability: ga
      x-snyk-api-version: '2024-06-21'
      x-stability-level: stable
  /orgs/{org_id}/invites/{invite_id}:
    delete:
      description: 'Cancel a pending user invitations to an organization.


        #### Required permissions


        - `Invite users (org.user.invite)`'
      operationId: deleteOrgInvitation
      parameters:
      - description: The id of the org the user is being invited to
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      - description: The id of the pending invite to cancel
        in: path
        name: invite_id
        required: true
        schema:
          format: uuid
          type: string
      - $ref: '#/components/parameters/Version'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      summary: Cancel a pending user invitations to an organization.
      tags:
      - Invites
      x-snyk-api-lifecycle: released
      x-snyk-api-releases:
      - '2022-11-14'
      x-snyk-api-resource: org_invitations
      x-snyk-api-stability: ga
      x-snyk-api-version: '2022-11-14'
      x-stability-level: stable
components:
  schemas:
    OrgInvitationAttributes20230828:
      additionalProperties: false
      properties:
        email:
          description: The email address of the invitee.
          example: example@email.com
          type: string
        is_active:
          description: 'The active status of the invitation. is_active of true indicates that the invitation is still waiting to be accepted. Invitations are considered inactive when accepted or revoked.

            '
          example: true
          type: boolean
        role:
          description: The role public ID that will be granted to to invitee on acceptance.
          example: f1968726-1dca-42d4-a4dc-80cab99e2b6c
          format: uuid
          type: string
      required:
      - email
      - is_active
      - role
      type: object
    ActualVersion:
