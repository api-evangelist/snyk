                              iac_mappings_count:
                                description: Amount of IaC resources this resource maps to.
                                format: int64
                                minimum: 0
                                type: integer
                              id:
                                description: Internal ID for a resource.
                                format: uuid
                                type: string
                              input_type:
                                enum:
                                - cloud_scan
                                - arm
                                - k8s
                                - tf
                                - tf_hcl
                                - tf_plan
                                - tf_state
                                - cfn
                                type: string
                              location:
                                maxLength: 256
