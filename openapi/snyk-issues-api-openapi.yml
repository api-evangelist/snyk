    IssueAttributes:
      additionalProperties: false
      description: issue attributes
      properties:
        classes:
          description: A list of details for weakness data, policy, etc that are the class of this issue's source.
          items:
            $ref: '#/components/schemas/Class'
          maxItems: 50
          minItems: 1
          type: array
        coordinates:
          description: 'Where the issue originated, specific to issue type. Details on what

            code, package, etc introduced the issue. An issue may be caused by

            more than one coordinate.

            '
          items:
            properties:
              created_at:
                description: The time when this coordinate was created.
                format: date-time
                type: string
              is_fixable_manually:
                description: Indicates whether a issue can be fixed manually by the user. This typically involves making changes directly to the code or configuration to address the issue.
                type: boolean
              is_fixable_snyk:
                description: Indicates whether Snyk can automatically provide a fix for the issue. Snyk might offer solutions like patches or upgrades that can be applied directly through its platform.
                type: boolean
              is_fixable_upstream:
                description: Indicates whether a fix is available from the upstream source, such as the original package maintainers. It means that the issue can be resolved by updating to a version where the maintainers have already addressed the vulnerability.
                type: boolean
              is_patchable:
                description: Indicates whether the issue can be fixed by applying a patch. Patches are specific code changes that address vulnerabilities without requiring a full upgrade of the package.
                type: boolean
              is_pinnable:
                description: Indicates whether the issue can be fixed by pinning the dependency to a specific version. Pinning involves locking the dependency to a version that is known to be secure.
                type: boolean
              is_upgradeable:
                description: Indicates whether the issue can be resolved by upgrading the package to a newer version. Upgrading typically involves moving to a version where the vulnerability has been fixed.
                type: boolean
              last_introduced_at:
                description: The time when this coordinate was last introduced.
                format: date-time
                type: string
              last_resolved_at:
                description: The time when this coordinate was last resolved.
                format: date-time
                type: string
              last_resolved_details:
                description: Optional details about the last resolution of this coordinate.
                type: string
              reachability:
                description: '- function and package are both presented in e.g. reporting as "Reachable", meaning that a direct or indirect path was found from the application to the vulnerable code.

                  - no-info is presented as "No path found", meaning that there was no path found from the application to the vulnerable code.

                  - not-applicable is presented as "Not applicable" and it means that reachability information isn''t applicable to the issue. E.g we do not provide reachability info for Snyk container issues.

                  '
                enum:
                - function
                - package
                - no-info
                - not-applicable
                type: string
