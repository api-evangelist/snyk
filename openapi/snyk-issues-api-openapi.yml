                        to a single Project and test run. Remedies with the same correlation_id must have the same contents.

                        '
                      maxLength: 256
                      minLength: 1
                      type: string
                    description:
                      description: A markdown-formatted optional description of this remedy. Links are not permitted.
                      maxLength: 4096
                      minLength: 1
                      type: string
                    meta:
                      additionalProperties: false
                      properties:
                        data:
                          additionalProperties: true
                          description: Metadata information related to apply a remedy. Limited in size to 100Kb when JSON serialized.
                          type: object
                        schema_version:
                          description: 'A schema version identifier the metadata object validates against. Note: this information is

                            only relevant in the domain of the API consumer: the issues system always considers metadata

                            just as an arbitrary object.

                            '
                          maxLength: 256
                          minLength: 1
                          type: string
                      required:
                      - data
                      - schema_version
                      type: object
                    type:
                      enum:
                      - indeterminate
                      - manual
                      - automated
                      - rule_result_message
                      - terraform
                      - cloudformation
                      - cli
                      - kubernetes
                      - arm
                      type: string
                  required:
                  - type
                  type: object
                maxItems: 5
                minItems: 1
                type: array
              representations:
                description: 'A list of precise locations that surface an issue. A coordinate may have multiple representations.

                  '
                items:
                  oneOf:
                  - description: An object that contains an opaque identifying string.
                    properties:
                      resourcePath:
                        maxLength: 2024
                        minLength: 1
                        type: string
                    required:
                    - resourcePath
                    type: object
                  - description: An object that contains a list of opaque identifying strings.
                    properties:
                      dependency:
                        properties:
