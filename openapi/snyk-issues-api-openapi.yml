                    type: object
                minItems: 1
                type: array
              state:
                description: The state of this coordinate.
                enum:
                - open
                - resolved
                type: string
              updated_at:
                description: The time when this coordinate was last updated.
                format: date-time
                type: string
            type: object
          minItems: 1
          type: array
        created_at:
          description: The creation time of this issue.
          format: date-time
          type: string
        description:
          description: A markdown-formatted optional description of this issue. Links are not permitted.
          example: 'Affected versions of this package are vulnerable to Prototype Pollution.

            The utilities function allow modification of the `Object` prototype.

            If an attacker can control part of the structure passed to this function,

