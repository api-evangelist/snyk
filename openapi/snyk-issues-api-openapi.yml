                            maxLength: 2048
                            minLength: 1
                            type: string
                        required:
                        - package_name
                        - package_version
                        type: object
                    required:
                    - dependency
                    type: object
                  - description: A resource location to some service, like a cloud resource. Only available for issue type 'cloud' and 'iac'.
                    properties:
                      cloud_resource:
                        properties:
                          environment:
                            properties:
                              id:
                                description: Internal ID for an environment.
                                format: uuid
                                type: string
                              name:
                                maxLength: 256
                                minLength: 1
                                type: string
                              native_id:
                                description: An optional native identifier for this environment. For example, a cloud account id.
                                maxLength: 2048
                                minLength: 1
                                type: string
                              type:
                                enum:
                                - aws
                                - azure
                                - azure_ad
                                - google
                                - scm
                                - cli
                                - tfc
                                type: string
                            required:
                            - id
