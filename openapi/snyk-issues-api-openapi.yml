      x-snyk-api-stability: ga
      x-snyk-api-version: '2025-11-05'
      x-stability-level: stable
  /orgs/{org_id}/packages/{purl}/issues:
    get:
      description: 'Query issues for a specific package version identified by Package URL (purl). Snyk returns only direct vulnerabilities. Transitive vulnerabilities (from dependencies) are not returned because they can vary depending on context. For Maven packages, you can optionally include a checksum qualifier in the PURL to request checksum validation. The response will include metadata indicating whether the provided checksum matches Snyk''s records. Vulnerabilities are always returned regardless of checksum match status; the validation metadata allows clients to interpret results appropriately.


        #### Required permissions


        - `View Organization (org.read)`'
      operationId: getIssuesPerPurl
      parameters:
      - $ref: '#/components/parameters/Version'
      - $ref: '#/components/parameters/PackageUrl'
      - description: Unique identifier for an organization
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Specify the number of results to skip before returning results. Must be greater than or equal to 0. Default is 0.
        in: query
        name: offset
        schema:
          minimum: 0
          type: integer
      - description: Specify the number of results to return. Must be greater than 0 and less than 1000. Default is 1000.
        in: query
        name: limit
        schema:
          maximum: 1000
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/IssuesResponse'
          description: Returns an array of issues
          headers:
            deprecation:
              $ref: '#/components/headers/DeprecationHeader'
            snyk-request-id:
              $ref: '#/components/headers/RequestIdResponseHeader'
            snyk-version-lifecycle-stage:
              $ref: '#/components/headers/VersionStageResponseHeader'
            snyk-version-requested:
              $ref: '#/components/headers/VersionRequestedResponseHeader'
            snyk-version-served:
              $ref: '#/components/headers/VersionServedResponseHeader'
            sunset:
              $ref: '#/components/headers/SunsetHeader'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
      summary: List issues for a package
      tags:
      - Issues
      x-snyk-api-lifecycle: released
      x-snyk-api-releases:
      - 2022-06-29~beta
      - '2022-09-15'
      - '2024-06-26'
      - '2025-11-05'
      x-snyk-api-resource: issues
      x-snyk-api-stability: ga
      x-snyk-api-version: '2025-11-05'
      x-stability-level: stable
