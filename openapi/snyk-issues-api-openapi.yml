  /orgs/{org_id}/packages/issues:
    post:
      description: 'This endpoint is currently restricted and is not available to all customers. Query issues for a batch of packages identified by Package URL (purl). Only direct vulnerabilities are returned; transitive vulnerabilities (from dependencies) are not included as they can vary depending on the context.


        #### Required permissions


        - `View Organization (org.read)`'
      operationId: listIssuesForManyPurls
      parameters:
      - $ref: '#/components/parameters/Version'
      - description: Unique identifier for an organization
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/BulkPackageUrlsRequestBody'
        required: true
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/IssuesWithPurlsResponse'
          description: Returns an array of issues with the purl identifier of the package that caused them
          headers:
            deprecation:
              $ref: '#/components/headers/DeprecationHeader'
            location:
              $ref: '#/components/headers/Location'
            snyk-request-id:
              $ref: '#/components/headers/RequestIdResponseHeader'
            snyk-version-lifecycle-stage:
              $ref: '#/components/headers/VersionStageResponseHeader'
            snyk-version-requested:
              $ref: '#/components/headers/VersionRequestedResponseHeader'
            snyk-version-served:
              $ref: '#/components/headers/VersionServedResponseHeader'
            sunset:
              $ref: '#/components/headers/SunsetHeader'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
      summary: List issues for a given set of packages  (Currently not available to all customers)
      tags:
      - Issues
      x-snyk-api-lifecycle: released
      x-snyk-api-releases:
      - 2023-01-04~experimental
      - 2023-03-29~beta
      - '2023-04-17'
      - '2023-08-21'
      - '2024-06-26'
      - '2025-11-05'
