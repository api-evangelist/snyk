components:
  parameters:
    RsqlFilter:
      description: RSQL filter expression for filtering results. See schema for full documentation.
      in: query
      name: filter
      schema:
        $ref: '#/components/schemas/RsqlFilterString'
    SparseFieldsets:
      description: 'Sparse fieldsets allow clients to request only specific fields for a given resource type.

        Use the format `fields[<type>]=field1,field2` where `<type>` is the JSON:API resource type.


        **Container image fields** (use with `fields[container_images]`):

        - `class` - Classification of the asset

        - `registry` - Container registry hostname

        - `repository` - Repository path

        - `config_digest` - Image config digest

        - `distribution_digests` - Distribution digests (manifest/index pairs)

        - `image_tags` - Distinct image tags across all discovery sources

        - `built_at` - When the image was built

        - `size_bytes` - Size of the image in bytes

        - `author` - Image author

        - `architecture` - CPU architecture

        - `os` - Operating system

        - `variant` - CPU architecture variant

        - `os_version` - Operating system version

        - `os_features` - OS features

        - `config` - Image runtime configuration (OCI config)

        - `root_fs` - Root filesystem information

        - `history` - Image build history

        - `inferred_base_images` - Inferred base images

        - `teams` - Teams associated with the asset

        - `labels` - Labels associated with the asset

        - `tags` - Key-value tags for the asset

        - `risk_score` - Risk score for the asset

        - `test_surfaces` - Test surfaces for the asset

        - `issues` - Issue counts by severity

        - `created_at` - When the asset was created

        - `updated_at` - When the asset was last updated

        - `last_scan` - When the asset was last scanned

        - `scan_engines` - Scan engines applied to the asset


        Note: `type` and `id` are always included regardless of field selection.

        '
      example:
        container_images: registry,repository,config_digest
      explode: true
      in: query
      name: fields
      schema:
        additionalProperties:
          type: string
        type: object
      style: deepObject
    RsqlFilterGroupValues:
      description: 'RSQL filter expression for filtering which assets are included in aggregation.

        Supports the same syntax as the main search filter including full text search with the `q` field.

        See the RsqlFilterString schema for complete documentation.

        '
      in: query
      name: filter
      schema:
        $ref: '#/components/schemas/RsqlFilterString'
    ProjectSortParam:
      description: 'Sort field with optional direction prefix. Prefix with `-` for descending order.


        **Supported fields:**

        - `snapshot_created_at` - Snapshot creation timestamp

        - `issues` - Issue counts by severity (critical, high, medium, low)


        When omitted, results are ordered by `snapshot_created_at` ascending.

        '
      example: -snapshot_created_at
      in: query
      name: sort
      schema:
        enum:
        - snapshot_created_at
        - -snapshot_created_at
        - issues
        - -issues
        type: string
    SortGroupValues:
      description: "Comma-separated sort fields for group values. Prefix with `-` for descending order.\nMultiple sort fields are supported (e.g., `-issues,count`).\nDefaults to `count` (ascending) when not specified.\nResults are always tie-broken by `value` for deterministic ordering.\n\nAvailable sort fields:\n  - `value` - Sort by the group value string (alphabetical)\n  - `count` - Sort by the number of assets in each group\n  - `last_seen_at` - Sort by the aggregated last_seen_at timestamp\n  - `updated_at` - Sort by the aggregated updated_at timestamp\n  - `risk_score` - Sort by the aggregated risk score\n  - `built_at` - Sort by the aggregated container image build timestamp\n  - `issues` - Sort by issue severity (critical → high → medium → low)\n"
      example: -count
      in: query
      name: sort
      schema:
        type: string
    MetaCount:
      description: 'Provide summary count in the response meta object when requested.

        When `with` is provided, the count will be included in the response meta object.

        When `only` is provided, the count will be included in the response meta object and no data will be returned.

        '
      example: with
      in: query
      name: meta_count
      schema:
        enum:
        - with
        - only
        type: string
    AggregateGroupValues:
      description: 'Per-field aggregate function override for meta fields.

        All fields default to `last` when not specified.

        `max`/`min` compute the SQL MAX/MIN across all assets in the group (scalar fields only).

        `first`/`last` returns the value from the single asset with the earliest/latest

        updated_at in the group (all field types).

        `sum` computes the total across all assets (numeric fields, issues, labels, tags).

        '
      explode: true
      in: query
      name: aggregate
      schema:
        properties:
          built_at:
            default: last
            enum:
            - max
            - min
            - first
            - last
            type: string
          issues:
            default: last
            enum:
            - first
            - last
            - sum
            type: string
          labels:
            default: last
            enum:
            - first
            - last
            - sum
            type: string
          last_seen_at:
            default: last
            enum:
            - max
            - min
            - first
            - last
            type: string
          risk_score:
            default: last
            enum:
            - max
            - min
            - first
            - last
            - sum
            type: string
          tags:
            default: last
            enum:
            - first
            - last
            - sum
            type: string
          updated_at:
            default: last
            enum:
            - max
            - min
            - first
            - last
            type: string
        type: object
      style: deepObject
    MetaFieldsGroupValues:
      description: "Meta fields to include in the response. Multiple fields can be specified.\n\nAvailable fields:\n  - `count` - Number of assets with this value\n  - `last_seen_at` - Aggregated last_seen_at timestamp (default aggregation: last)\n  - `updated_at` - Aggregated updated_at timestamp (default aggregation: last)\n  - `risk_score` - Aggregated risk score from discovery sources (default aggregation: last)\n  - `issues` - Aggregated issue counts (critical, high, medium, low, total) (default aggregation: last)\n  - `labels` - Labels across assets (default aggregation: last)\n  - `tags` - Tags across assets (default aggregation: last)\n  - `built_at` - Aggregated container image build timestamp (default aggregation: last)\n  - `all` - Include all available meta fields\n\nAll fields default to the `last` aggregation function, which returns the value\nfrom the asset with the most recent updated_at in the group. Use the `aggregate`\nparameter to override the aggregation function per field.\n\nIf not specified, the meta object is not included in the response.\n\nNote: Requesting meta fields may impact response time as aggregations\nrequire additional computation.\n"
      example:
      - count
      - risk_score
      - issues
      - labels
      explode: false
      in: query
      name: meta_fields
      schema:
        items:
          enum:
          - count
          - last_seen_at
          - updated_at
          - risk_score
          - issues
          - labels
          - tags
          - built_at
          - all
          type: string
        type: array
      style: form
