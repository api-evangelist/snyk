    RsqlFilterString:
      description: 'RSQL filter expression for filtering results.


        **Supported operators:**

        - `==` (equal), `!=` (not equal)

        - `<` or `=lt=` (less than), `>` or `=gt=` (greater than)

        - `<=` or `=le=` (less than or equal), `>=` or `=ge=` (greater than or equal)

        - `=in=(val1,val2)` (IN list), `=out=(val1,val2)` (NOT IN list)

        - `;` or ` and ` (logical AND), `,` or ` or ` (logical OR) - word operators are case-insensitive


        **Wildcard pattern matching:**

        Use `*` (asterisk) for flexible string matching with `==` and `!=` operators:

        - `*value*` - Contains (e.g., `registry==*docker*` matches "docker.io")

        - `value*` - Starts with (e.g., `registry==docker*` matches "docker.io")

        - `*value` - Ends with (e.g., `name==*nginx` matches "library/nginx")

        - `!=*value*` - Does not contain (e.g., `class!=*test*`)


        Note: Special SQL characters (%, _) are automatically escaped for security.


        **Quoted values:**

        Values can optionally be wrapped in single quotes (`''...''`) or double quotes (`"..."`).

        Quotes are stripped before comparison, so `registry==''docker.io''` is equivalent to `registry==docker.io`.

        Escaped quotes inside quoted values are supported (e.g., `name=="O\"Reilly"`).

        Quoting is required when filtering for empty values (see below).


        **Filtering for empty values:**

        Use empty quotes (`''''` or `""`) with `==` or `!=` to filter by empty fields:

        - `registry==''''` - Matches assets where registry is empty

        - `registry!=''''` - Matches assets where registry has a value


        **Multi-field substring search:**

        Use the special `q` field to search across multiple fields simultaneously using case-insensitive substring matching:

        - `q==<search_term>` - Searches across all searchable string fields (labels, tags, registry, repository, name, config_digest, manifest_digest, index_digest, image_tag)

        - Only supports the `==` operator (no wildcards needed - automatically searches for substring matches)

        - Uses case-insensitive pattern matching (PostgreSQL ILIKE)

        - Does not support linguistic features like stemming or ranking

        - Special characters are automatically escaped for security

        - Can be combined with other filters: `q==nginx;type==container_images`


        **Supported fields:**


        Common fields (apply to all asset types):

        - `q` (string) - Multi-field substring search (see above)

        - `id` (UUID) - Asset ID

        - `type` (string) - Type of asset. Allowed values: `container_images`

        - `class` (string) - Class of asset (e.g., A, B)

        - `created_at` (timestamp) - Asset creation timestamp (ISO 8601 format)

        - `updated_at` (timestamp) - Asset last update timestamp (ISO 8601 format)

        - `labels` (string array) - Asset labels

        - `tags` (object) - Asset tags. Requires a sub-field (e.g., `tags.env==production`)


        Container image fields (apply when type is `container_images`):

        - `registry` (string) - Container image registry (e.g., docker.io)

        - `repository` (string) - Container image repository path

        - `name` (string) - Container image name

        - `config_digest` (string) - Image config digest

        - `manifest_digest` (string) - Distribution manifest digest

        - `index_digest` (string) - Distribution index digest

        - `image_tag` (string) - Image tag from discovery source

        - `image_labels` (object) - OCI image config labels. Requires a sub-field (e.g., `image_labels.vendor==nginx`)


        **Examples:**

        - `q==nginx` - Multi-field substring search for "nginx"

        - `q==docker.io;type==container_images` - Search "docker.io" substring in container images only

        - `type==container_images` - Exact match on asset type

        - `registry==*docker*` - Registry contains "docker" (wildcard)

        - `created_at>2024-01-01` or `created_at=gt=2024-01-01` - Date comparison

        - `class==A;created_at=ge=2024-01-01` - AND combination

        - `labels=in=(production,staging)` - Labels IN list

        - `tags.env==production` - Tag sub-field filter

        - `image_labels.vendor==nginx` - Image label sub-field filter

        - `registry==''docker.io''` - Quoted value (equivalent to `registry==docker.io`)

        - `registry==''''` - Assets where registry is empty

        - `registry!=''''` - Assets where registry has a value

        '
      example: type==container_images;created_at>2024-01-01
      type: string
    TagsUpdate:
