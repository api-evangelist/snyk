                  type: string
                severity:
                  allOf:
                  - description: Indicate the severity of a finding discovered by a Test.
                    enum:
                    - critical
                    - high
                    - medium
                    - low
                    - none
                    - other
                    type: string
                  description: Severity level of the finding.
                short_description:
