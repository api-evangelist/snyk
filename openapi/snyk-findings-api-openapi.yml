          description: When the suppression was first created.
          format: date-time
          type: string
        expires_at:
          description: When the suppression will expire.
          format: date-time
          type: string
        justification:
          description: Reason given for an ignore pending approval.
          type: string
        path:
          description: 'Dependency path to the vulnerable package to be suppressed.


            If not provided, the suppression will apply to all packages with the given

            vulnerability ID.'
          items:
            type: string
          type: array
        policy:
          allOf:
          - $ref: '#/components/schemas/PolicyRef'
          description: Policy responsible for the state of suppression represented here, if available.
        skipIfFixable:
