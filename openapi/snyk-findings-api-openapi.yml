    ManagedPolicyRef:
      description: Reference to a managed policy.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
      required:
      - id
      type: object
    OtherEvidence:
      description: 'Evidence which this API version is not capable of expressing.


        More information may be available in a newer version of this API.'
      properties:
        source:
          enum:
          - other
          type: string
      required:
      - source
      type: object
    io.snyk.api.common.LinkProperty:
      oneOf:
      - $ref: '#/components/schemas/io.snyk.api.common.LinkString'
      - $ref: '#/components/schemas/io.snyk.api.common.LinkObject'
    ReachabilityEvidence:
      description: Indicate the reachability signals as additional evidence for the finding.
      properties:
        paths:
          description: 'Paths by which the vulnerable code can be reached.


            Includes the name of the function, the path through the

            source code that reaches the function, and the location

            at which the vulnerable function is called.'
          items:
            $ref: '#/components/schemas/ReachablePath'
          minItems: 1
          type: array
        reachability:
          $ref: '#/components/schemas/ReachabilityType'
        source:
          enum:
          - reachability
          type: string
      required:
      - source
      - reachability
      type: object
    PolicyModification:
      description: Prior attribute values and the reason they were modified.
      properties:
        pointer:
          description: 'A JSON Pointer (RFC 6901) reference to the modified value, relative to

            the top-level attributes of the same Finding.'
          example: /rating/severity
          type: string
        policy:
          allOf:
          - $ref: '#/components/schemas/PolicyRef'
          description: Policy which modified the finding, if available.
        prior:
          description: The prior value at the referenced pointer.
          example: low
        reason:
          description: A human-readable explanation for why the value was modified.
          example: CWE-123 poses an elevated risk to workloads exposed to the public internet
          type: string
      required:
      - pointer
      - reason
