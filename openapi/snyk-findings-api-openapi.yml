          type: boolean
        status:
          allOf:
          - $ref: '#/components/schemas/SuppressionStatus'
          description: Status of the suppression.
      required:
      - status
      type: object
    DiffSuggestion:
      description: A suggestion in unified diff format representing the code changes to fix the vulnerability.
      properties:
        diff:
          description: 'Unified diff that contains changes for one or multiple files.

            It already contains file path, but this can be extracted as a separate field if needed.'
          maxLength: 10485760
          type: string
        external_id:
          description: The fix suggestion identifier from an external source.
          format: uuid
          type: string
        rank:
          format: uint8
          type: integer
      required:
      - diff
      type: object
    PinPackageAdvice:
      description: 'Pin a package at a specific version. Pinning is a capability not supported

        by all ecosystems, which causes a transitive dependency to be pinned at

        a specific version with an override.


        For example, the `replace` go.mod directive can override package dependency

        constraints, forcing a specific version to be used in the application.


        Pinning could break an application.


        Note: In practice pin actions today are solely used in python pip''s packages as pip does not calculate upgrade paths'
      example:
        format: pin_package_advice
        package_name: requests
        pin_version: 2.25.1
      properties:
        format:
          enum:
          - pin_package_advice
          type: string
        package_name:
          type: string
        pin_version:
          type: string
      required:
      - format
      - package_name
      - pin_version
      type: object
    FixAttributes:
      description: FixAttributes is the main payload modelling a fix
      properties:
        action:
          allOf:
          - $ref: '#/components/schemas/FixAction'
          description: 'Applying the steps specified by the action within the fix leads to resolving either completely or partially this finding.

            An action may be a simple upgrade, a code swap, or may model sets of boolean operations.


            For now only simple actions are modelled but could be extended to include more complex actions in the future.

            See doc for more info: https://docs.google.com/document/d/151vAXurvX4k8fNOWspSI2Ou9OF1G5fj8LHa-NuKOfgw'
        outcome:
          allOf:
          - $ref: '#/components/schemas/FixAppliedOutcome'
          description: Indicates whether applying these actions will address the finding or not
      required:
      - outcome
      type: object
    io.snyk.api.common.PaginatedLinks:
      properties:
        first:
          $ref: '#/components/schemas/io.snyk.api.common.LinkProperty'
        last:
          $ref: '#/components/schemas/io.snyk.api.common.LinkProperty'
        next:
          $ref: '#/components/schemas/io.snyk.api.common.LinkProperty'
        prev:
          $ref: '#/components/schemas/io.snyk.api.common.LinkProperty'
        self:
          $ref: '#/components/schemas/io.snyk.api.common.LinkProperty'
      type: object
    PackageLocation:
      description: 'Package dependency version.


        Finding type: SCA'
      example:
        package:
          name: log4j
          version: 2.4.1
        type: package
      properties:
        package:
          $ref: '#/components/schemas/Package'
        type:
          enum:
          - package
          type: string
      required:
      - type
      - package
      type: object
    FixAppliedOutcome:
