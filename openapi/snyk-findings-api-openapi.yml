        mapping:
          diff: '#/components/schemas/Diff'
          pin_package_advice: '#/components/schemas/PinPackageAdvice'
          upgrade_package_advice: '#/components/schemas/UpgradePackageAdvice'
        propertyName: format
      oneOf:
