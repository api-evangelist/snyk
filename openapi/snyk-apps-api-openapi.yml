openapi: 3.0.3
info:
  title: Snyk AccessRequests Apps API
  version: REST
servers:
- description: Snyk REST API
  url: https://api.snyk.io/rest
security:
- APIToken: []
- BearerAuth: []
tags:
- name: Apps
paths:
  /groups/{group_id}/apps/installs:
    get:
      description: 'Get a list of Snyk Apps installed for a Group


        #### Required permissions


        - `View Apps (group.app.read)`'
      operationId: getAppInstallsForGroup
      parameters:
      - description: Expand relationships.
        explode: false
        in: query
        name: expand
        schema:
          items:
            enum:
            - app
            type: string
          type: array
        style: form
      - description: Group ID
        in: path
        name: group_id
        required: true
        schema:
          format: uuid
          type: string
      - $ref: '#/components/parameters/Version'
      - $ref: '#/components/parameters/StartingAfter'
      - $ref: '#/components/parameters/EndingBefore'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/AppInstallData'
                    type: array
                  jsonapi:
                    $ref: '#/components/schemas/JsonApi'
                  links:
                    $ref: '#/components/schemas/PaginatedLinks'
                required:
                - data
                - jsonapi
                - links
                type: object
          description: A list of apps installed for the specified group.
          headers:
            deprecation:
              $ref: '#/components/headers/DeprecationHeader'
            snyk-request-id:
              $ref: '#/components/headers/RequestIdResponseHeader'
            snyk-version-lifecycle-stage:
              $ref: '#/components/headers/VersionStageResponseHeader'
            snyk-version-requested:
              $ref: '#/components/headers/VersionRequestedResponseHeader'
            snyk-version-served:
              $ref: '#/components/headers/VersionServedResponseHeader'
            sunset:
              $ref: '#/components/headers/SunsetHeader'
        '400':
          $ref: '#/components/responses/400__0'
        '401':
          $ref: '#/components/responses/401__0'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404__0'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500__0'
      summary: Get a list of Snyk Apps installed for a Group
      tags:
      - Apps
      x-snyk-api-lifecycle: released
      x-snyk-api-releases:
      - 2023-06-19~experimental
      - '2023-11-03'
      - '2024-05-23'
      x-snyk-api-resource: app_installs
      x-snyk-api-stability: ga
      x-snyk-api-version: '2024-05-23'
      x-stability-level: stable
    post:
      description: 'Install a Snyk App to this group, the Snyk App must use unattended authentication e.g. client credentials


        #### Required permissions


        - `Install Apps (group.app.install)`'
      operationId: createGroupAppInstall
      parameters:
      - $ref: '#/components/parameters/Version'
      - description: Group ID
        in: path
        name: group_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              additionalProperties: false
              properties:
                data:
                  properties:
                    type:
                      enum:
                      - app_install
                      example: app_install
                      type: string
                  type: object
                relationships:
                  additionalProperties: false
                  properties:
                    app:
                      additionalProperties: false
                      properties:
                        data:
                          additionalProperties: false
                          properties:
                            id:
                              $ref: '#/components/schemas/Uuid'
                            type:
                              enum:
                              - app
                              example: app
                              type: string
                          required:
                          - id
                          - type
                          type: object
                      required:
                      - data
                      type: object
                  required:
                  - app
                  type: object
              required:
              - data
              - relationships
              type: object
        description: App Install to be created
      responses:
        '201':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/AppInstallWithClient'
                  jsonapi:
                    $ref: '#/components/schemas/JsonApi'
                  links:
                    $ref: '#/components/schemas/PaginatedLinks'
                required:
                - data
                - jsonapi
                - links
                type: object
          description: The newly created app install.
          headers:
            deprecation:
              $ref: '#/components/headers/DeprecationHeader'
            location:
              schema:
                type: string
            snyk-request-id:
              $ref: '#/components/headers/RequestIdResponseHeader'
            snyk-version-lifecycle-stage:
              $ref: '#/components/headers/VersionStageResponseHeader'
            snyk-version-requested:
              $ref: '#/components/headers/VersionRequestedResponseHeader'
            snyk-version-served:
              $ref: '#/components/headers/VersionServedResponseHeader'
            sunset:
              $ref: '#/components/headers/SunsetHeader'
        '400':
          $ref: '#/components/responses/400__0'
        '401':
          $ref: '#/components/responses/401__0'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404__0'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500__0'
      summary: Install a Snyk App for a Group
      tags:
      - Apps
      x-snyk-api-lifecycle: released
      x-snyk-api-releases:
      - 2023-06-19~experimental
      - '2023-11-03'
      - '2024-05-23'
      x-snyk-api-resource: app_installs
      x-snyk-api-stability: ga
      x-snyk-api-version: '2024-05-23'
      x-stability-level: stable
  /groups/{group_id}/apps/installs/{install_id}:
    delete:
      description: 'Revoke app authorization for a Snyk group with install ID


        #### Required permissions


        - `Install Apps (group.app.install)`'
      operationId: deleteGroupAppInstallById
