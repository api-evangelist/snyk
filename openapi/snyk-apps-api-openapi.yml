        '500':
          $ref: '#/components/responses/500__0'
      summary: Revoke app authorization for a Snyk group with install ID
      tags:
      - Apps
      x-snyk-api-lifecycle: released
      x-snyk-api-releases:
      - 2023-06-19~experimental
      - '2023-11-03'
      - '2024-05-23'
      x-snyk-api-resource: app_installs
      x-snyk-api-stability: ga
      x-snyk-api-version: '2024-05-23'
      x-stability-level: stable
  /groups/{group_id}/apps/installs/{install_id}/secrets:
    post:
      description: 'Manage client secret for non-interactive Snyk App installations


        #### Required permissions


        - `Edit Apps (group.app.edit)`'
      operationId: updateGroupAppInstallSecret
      parameters:
      - $ref: '#/components/parameters/Version'
      - description: Group ID
        in: path
        name: group_id
        required: true
        schema:
          format: uuid
          type: string
      - $ref: '#/components/parameters/InstallId'
      requestBody:
        content:
          application/vnd.api+json:
            schema:
              additionalProperties: false
              properties:
                data:
                  additionalProperties: false
                  properties:
                    attributes:
                      additionalProperties: false
                      properties:
                        mode:
                          description: "Operation to perform:\n  * `replace` - Replace existing secrets with a new generated\nsecret\n  * `create` - Add a new secret, preserving existing secrets\n  * `delete` - Remove an existing secret by value\n"
                          enum:
                          - replace
                          - create
                          - delete
                          type: string
                        secret:
                          description: Secret to delete when using `delete` mode
                          type: string
                      required:
                      - mode
                      type: object
                    type:
                      enum:
                      - app
                      type: string
                  required:
                  - attributes
                  - type
                  type: object
              required:
              - data
              type: object
      responses:
        '200':
          content:
            application/vnd.api+json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/AppInstallDataWithSecret'
                  jsonapi:
                    $ref: '#/components/schemas/JsonApi'
                  links:
                    $ref: '#/components/schemas/SelfLink'
                type: object
          description: Secret has been updated.
          headers:
            deprecation:
              $ref: '#/components/headers/DeprecationHeader'
            location:
              schema:
                type: string
            snyk-request-id:
              $ref: '#/components/headers/RequestIdResponseHeader'
            snyk-version-lifecycle-stage:
              $ref: '#/components/headers/VersionStageResponseHeader'
            snyk-version-requested:
              $ref: '#/components/headers/VersionRequestedResponseHeader'
            snyk-version-served:
              $ref: '#/components/headers/VersionServedResponseHeader'
            sunset:
              $ref: '#/components/headers/SunsetHeader'
        '400':
          $ref: '#/components/responses/400__0'
        '401':
          $ref: '#/components/responses/401__0'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404__0'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500__0'
      summary: Manage client secret for non-interactive Snyk App installations
      tags:
      - Apps
      x-snyk-api-lifecycle: released
      x-snyk-api-releases:
      - 2023-06-19~experimental
      - '2023-11-03'
      - '2024-05-23'
      x-snyk-api-resource: app_installs
