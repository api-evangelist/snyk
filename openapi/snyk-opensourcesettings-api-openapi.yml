        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      summary: Update opensource broker settings of ecosystem for organization
      tags:
      - OpenSourceSettings
      x-snyk-api-lifecycle: released
      x-snyk-api-releases:
      - '2024-10-15'
      x-snyk-api-resource: opensourceSettings
      x-snyk-api-stability: ga
      x-snyk-api-version: '2024-10-15'
      x-stability-level: stable
components:
  examples:
    PostBrokerSettingsRequestAddIntegration:
      summary: Add an integration
      value:
        data:
          integrations:
          - integration_type: artifactory
            urls:
            - https://artifactory.internal-domain.com/artifactory/api/nuget/v3/team-nuget/index.json
    GetBrokerSettingsResponseWithIntegrations:
      summary: Broker settings with some integrations configured
      value:
        data:
          integrations:
          - created_at: '2026-04-15T10:00:00.000Z'
            id: 019d7722-72c3-7ae4-bb4e-40deea1820c0
            integration_type: artifactory
            urls:
            - https://artifactory.internal-domain.com/artifactory/api/nuget/v3/nuget-group/index.json
          - created_at: '2026-04-16T10:00:00.000Z'
            id: 019d7722-90bd-7bc0-9666-775eee165cf0
            integration_type: nexus-private-repo
            urls:
            - https://nexus.internal-domain.com/repository/nuget-hosted/index.json
            - https://nexus.internal-domain.com/repository/nuget-proxy/index.json
        jsonapi:
          version: '1.0'
        links:
          self: /orgs/db2557c3-ecb8-4d45-8e1e-894ae89a92a6/settings/opensource/Dotnet/broker?version=2024-10-15
    PostBrokerSettingsRequestEditIntegrations:
      summary: Edit multiple integrations at once
      value:
        data:
          integrations:
          - integration_type: artifactory
            urls:
            - https://artifactory.internal-domain.com/artifactory/api/nuget/v3/sandbox-nuget/index.json
            - https://artifactory.internal-domain.com/artifactory/api/nuget/v3/production-nuget/index.json
          - integration_type: nexus-private-repo
            urls: []
    GetBrokerSettingsResponseEmpty:
      summary: No integrations configured
      value:
        data:
          integrations: []
        jsonapi:
          version: '1.0'
        links:
          self: /orgs/82b3efbb-4b32-4f96-8005-9444eceacec8/settings/opensource/Dotnet/broker?version=2024-10-15
    PostBrokerSettingsRequestRemoveIntegration:
      summary: Remove an integration by setting empty urls
      value:
        data:
          integrations:
          - integration_type: nexus-private-repo
            urls: []
    PostBrokerSettingsResponse:
      summary: Response after updating broker settings
      value:
        data:
          integrations:
          - created_at: '2024-01-15T10:00:00.000Z'
            id: 019d7722-d843-7b9f-a1dd-bd5c0bac373d
            integration_type: artifactory
            urls:
            - https://artifactory.internal-domain.com/artifactory/api/nuget/v3/team-nuget/index.json
        jsonapi:
          version: '1.0'
        links:
          self: /orgs/4f4fbf18-b2cd-4bf3-9b7e-323b8be249ea/settings/opensource/Dotnet/broker?version=2024-10-15
  headers:
    SunsetHeader:
      description: 'A header containing the date of when the underlying endpoint will be removed. This header is only present if the endpoint has been deprecated. For information purposes only. Returned as a date in the format: YYYY-MM-DD'
      example: '2021-08-02'
      schema:
        format: date
        type: string
    VersionRequestedResponseHeader:
      description: A header containing the version of the endpoint requested by the caller.
      example: '2026-03-25'
      schema:
        $ref: '#/components/schemas/QueryVersion'
    VersionServedResponseHeader:
      description: A header containing the version of the endpoint that was served by the API.
      example: '2026-03-25'
      schema:
        $ref: '#/components/schemas/ActualVersion'
    VersionStageResponseHeader:
      description: 'A header containing the version stage of the endpoint. This stage describes the guarantees snyk provides surrounding stability of the endpoint.

        '
      schema:
        enum:
        - wip
        - experimental
        - beta
        - ga
        - deprecated
        - sunset
        example: ga
        type: string
    RequestIdResponseHeader:
      description: 'A header containing a unique id used for tracking this request. If you are reporting an issue to Snyk it''s very helpful to provide this ID.

        '
      example: 4b58e274-ec62-4fab-917b-1d2c48d6bdef
      schema:
        format: uuid
        type: string
    LocationHeader:
      description: 'A header providing a URL for the location of a resource

        '
      example: https://example.com/resource/4
      schema:
        format: url
        type: string
    DeprecationHeader:
      description: 'A header containing the deprecation date of the underlying endpoint. For more information, please refer to the deprecation header RFC:

        https://tools.ietf.org/id/draft-dalal-deprecation-header-01.html

        '
      example: '2021-07-01T00:00:00Z'
