  /orgs/{org_id}/settings/opensource/{ecosystem}/broker:
    get:
      description: 'Retrieves all Broker settings of a specific Open Source Ecosystem for an Organization


        #### Required permissions


        - `View Organization (org.read)`'
      operationId: getOpensourceBrokerEcosystemSettingsForOrg
      parameters:
      - $ref: '#/components/parameters/Version'
      - description: Org ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      - description: The ecosystem identifier
        in: path
        name: ecosystem
        required: true
        schema:
          enum:
          - Dotnet
          - Golang
          type: string
      responses:
        '200':
          content:
            application/vnd.api+json:
              examples:
                Empty:
                  $ref: '#/components/examples/GetBrokerSettingsResponseEmpty'
                WithIntegrations:
                  $ref: '#/components/examples/GetBrokerSettingsResponseWithIntegrations'
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/BrokerSettings'
                  jsonapi:
                    $ref: '#/components/schemas/JsonApi'
                  links:
                    $ref: '#/components/schemas/PaginatedLinks'
          description: Successfully retrieved Broker settings
          headers:
            deprecation:
              $ref: '#/components/headers/DeprecationHeader'
            snyk-request-id:
              $ref: '#/components/headers/RequestIdResponseHeader'
            snyk-version-lifecycle-stage:
              $ref: '#/components/headers/VersionStageResponseHeader'
            snyk-version-requested:
              $ref: '#/components/headers/VersionRequestedResponseHeader'
            snyk-version-served:
              $ref: '#/components/headers/VersionServedResponseHeader'
