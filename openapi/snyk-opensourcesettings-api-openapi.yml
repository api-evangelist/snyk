      - $ref: '#/components/parameters/Version'
      - description: Org ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      - description: The ecosystem identifier
        in: path
        name: ecosystem
        required: true
        schema:
          enum:
          - Dotnet
          - Golang
          type: string
      requestBody:
        content:
          application/vnd.api+json:
            examples:
              AddIntegration:
                $ref: '#/components/examples/PostBrokerSettingsRequestAddIntegration'
              EditIntegrations:
                $ref: '#/components/examples/PostBrokerSettingsRequestEditIntegrations'
              RemoveIntegration:
                $ref: '#/components/examples/PostBrokerSettingsRequestRemoveIntegration'
            schema:
              additionalProperties: false
              properties:
                data:
                  $ref: '#/components/schemas/BrokerSettings'
              required:
              - data
              type: object
        required: true
      responses:
        '200':
          content:
            application/vnd.api+json:
              examples:
                WithIntegrations:
                  $ref: '#/components/examples/PostBrokerSettingsResponse'
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/BrokerSettings'
                  jsonapi:
                    $ref: '#/components/schemas/JsonApi'
                  links:
                    $ref: '#/components/schemas/PaginatedLinks'
          description: Successfully updated Broker settings
