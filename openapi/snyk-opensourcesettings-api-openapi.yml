      - OpenSourceSettings
      x-snyk-api-lifecycle: released
      x-snyk-api-releases:
      - '2024-10-15'
      x-snyk-api-resource: opensourceSettings
      x-snyk-api-stability: ga
      x-snyk-api-version: '2024-10-15'
      x-stability-level: stable
    patch:
      description: 'Updates all Broker settings of a specific Open Source Ecosystem for an Organization.

        This endpoint has JSON-PATCH semantics: only provided Broker integrations are updated.

        Provide an empty value for `urls` to remove a Broker integration.


        #### Required permissions


        - `Edit Organization (org.edit)`'
      operationId: updateOpensourceBrokerEcosystemSettingsForOrg
