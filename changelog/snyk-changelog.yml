observations:
  - >-
    Snyk badges breaking changes at the BULLET level, not the entry level, so a single dated
    block can be mostly additive with two lines that break you. Reading only the headings is
    not enough.
  - >-
    Adding a new enum value to a response property is explicitly badged Breaking by Snyk
    (2026-07-29, `secrets` on issue type). Clients that switch exhaustively on enums are the
    intended audience for that badge.
  - >-
    Every block in the current window targets version 2026-03-25. New dated GA versions are
    rare - 2024-10-15, 2025-09-17, 2025-09-28, 2025-11-05, 2026-03-25 - so most change lands
    inside an existing version.
