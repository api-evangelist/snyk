description: >-
  Snyk maintains a dated, per-operation API changelog that reads like a machine diff of the
  OpenAPI document rather than a marketing release note: each entry names the HTTP method and
  path, says Added or Updated, and lists the exact properties and parameters that changed,
  with a yellow "Breaking" badge on the individual bullets that break clients. The published
  page is 126KB of markdown covering 17 dated update blocks, all against the single current
  GA version 2026-03-25. That is the notable structural fact - Snyk keeps shipping additive
  and even breaking-badged changes INSIDE the 2026-03-25 version rather than cutting a new
  dated version each time, so pinning a version does not fully insulate a client from change.
